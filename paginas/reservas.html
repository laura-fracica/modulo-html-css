<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header>
        <h1>Reserva tu bicicleta</h1>
        <p>Contactanos</p> <a href="hola@ruedalibre.example" target=""_blank">GMAIL</a>
        
        <nav>
            <ul>
                <li>Inicio <a href="../index.html">Inicio</a></li>
                <li>Tarifas <a href="../paginas/tarifas.html">Tarifas</a></li>
                <li>Rutas <a href="../paginas/tarifas.html#planes">Planes</a></li>
                <li>Reservas <a href="../paginas/reservas.html">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="formulario-reserva">
            <form action="/enviar-reserva" method="post">
                <fieldset>
                    <legend id="datos">Tus datos:</legend>
                    <p>
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" 
                        id="nombre" 
                        name="nombre"
                        minlength="3"
                        maxlength="20" required>
                        

                        <label for="docuemento">Documento:</label>
                        <input type="text" 
                        inputmode="numeric"
                        id="documento" 
                        name="documento"
                        minlength="6"
                        maxlength="10" required>

                        <label for="email">Email:</label>
                        <input type="email" 
                        id="email" 
                        name="email"
                        placeholder="example@gmail.com" required>

                        <label for="celular">Celular:</label>
                        <input type="text"
                        inputmode="numeric" 
                        name="celular" 
                        id="celular" 
                        pattern="3[0-9]{2,9}"
                        placeholder="3121234567"
                        required
                        >

                    </p>
                </fieldset>

                <fieldset>
                    <legend id="alquiler">Tu alquiler:</legend>
                    <p>
                        <label for="tiempo">Fecha:</label>
                        <input type="number" 
                        id="tiempo" 
                        name="tiempo" 
                        min="2026-11-01"
                        max="2026-12-31" 
                        placeholder="año-mes-dia"
                        required>
                
                        <label for="opciones">Selecciona un tamaño:</label>
                            <select name="bicicleta" id="bicicleta">
                                <option value="pequeña">Urbana</option>
                                <option value="mediana">Montaña</option>
                                <option value="grande">Electrica</option>
                            </select>
                            
                        <label for="plan">Plan a escoger:</label>
                        <select name="plan" id="plan">
                            <option value="plan1">Rio y parques</option>
                            <option value="plan2">Sabores de barrio</option>
                            <option value="plan3">Reto las palmas</option>
                        </select>

                        <label for="cantidaddebicicleta">Cantidad de Bicicletas:</label>
                        <input type="cantidad" 
                        name="cantidad" 
                        id="cantidaddebicileta"
                        pattern="1[0-6]{1,2}">
                    
                    </p>                                
                </fieldset>

                <fieldset>
                    <legend id="confirmacion">Confirmacion:</legend>
                    <label for="comentarios"></label>
                    <input type="text" value="Comentarios" placeholder="comentarios" maxlength="300">

                    <label for="politicas">Politicas de alquiler:</label>
                    <button id="politicas">Aceptar</button>
                    <input type="politicas" required> 
                </fieldset>

                <fieldset>
                    <button>ENVIAR</button>
                    <input type="button" name="enviar" id="enviar">
                </fieldset>

            </form>
        </section>
    </main>


    <footer>
        <dd>Rueda libre</dd>
        <dd><a href="hola@ruedalibre.example">Contactanos</a></dd>
        <dd>2026</dd>
    </footer>

</body>
</html>
